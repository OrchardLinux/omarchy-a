// Omarchy A: Firefox defaults that depend on the session. AutoConfig skips this first line.
// The login session (arch-ipad-login-session) sets both variables only when the
// desktop draws on the GPU and a hardware video decoder is there: decode video
// through VA-API. Firefox does not know these boards, so its own hardware list
// would keep the decoder off. Elsewhere Firefox keeps its stock defaults.
if (getenv("MOZ_DISABLE_RDD_SANDBOX") == "1" && getenv("LIBVA_DRIVER_NAME") == "v4l2_request") {
  defaultPref("media.ffmpeg.vaapi.enabled", true);
  defaultPref("media.hardware-video-decoding.force-enabled", true);
  // The decoder plays H.264. YouTube and other adaptive players pick AV1 or
  // VP9 when Firefox offers them, which the CPU would have to decode: offer
  // neither, so they send H.264 (on YouTube up to 1080p). VP9 files outside
  // adaptive players still play in software.
  defaultPref("media.av1.enabled", false);
  defaultPref("media.mediasource.vp9.enabled", false);
}

// Match the explicit hardware arm used by the qualified G5P desktop runner.
// The private libraries alone do not select that arm of Firefox's policy.
if (getenv("OMARCHY_G5P") == "1") {
  defaultPref("gfx.webrender.all", true);
  defaultPref("gfx.webrender.software", false);
  defaultPref("gfx.webrender.force-disabled", false);
  defaultPref("layers.acceleration.force-enabled", true);
  defaultPref("webgl.force-enabled", true);
  defaultPref("webgl.disabled", false);
}

// Small dual-core systems use bounded caches and fewer spare/content processes.
if (getenv("OMARCHY_LOW_MEMORY") == "1") {
  defaultPref("dom.ipc.processCount", 2);
  defaultPref("dom.ipc.processCount.webIsolated", 1);
  defaultPref("dom.ipc.processPrelaunch.enabled", false);
  defaultPref("browser.cache.memory.capacity", 32768); // KiB; network cache only
  defaultPref("browser.cache.disk.capacity", 131072); // KiB on NVMe, not RAM
  defaultPref("browser.cache.disk.smart_size.enabled", false);
  defaultPref("browser.sessionhistory.max_total_viewers", 1);
  defaultPref("browser.tabs.unloadOnLowMemory", true);
  // Optional research arm: restarting with OMARCHY_RAM2_NO_FISSION=1 trades
  // site isolation for fewer content processes. Keep isolation by default.
  if (getenv("OMARCHY_RAM2_NO_FISSION") == "1") {
    defaultPref("fission.autostart", false);
  }
}
