# The speaker PCM's slots are connector left/right, then camera left/right,
# as seen in upright portrait. Expose stereo to applications and address all
# four slots independently. The rotation helper updates the mixer gains.
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "J120 Speaker Routing"
            filter.graph = {
                nodes = [
                    { type = builtin name = left label = copy }
                    { type = builtin name = right label = copy }
                    { type = builtin name = connector_left label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                    { type = builtin name = connector_right label = mixer control = { "Gain 1" = 0.0 "Gain 2" = 1.0 } }
                    { type = builtin name = camera_left label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                    { type = builtin name = camera_right label = mixer control = { "Gain 1" = 0.0 "Gain 2" = 1.0 } }
                ]
                links = [
                    { output = "left:Out"  input = "connector_left:In 1" }
                    { output = "right:Out" input = "connector_left:In 2" }
                    { output = "left:Out"  input = "connector_right:In 1" }
                    { output = "right:Out" input = "connector_right:In 2" }
                    { output = "left:Out"  input = "camera_left:In 1" }
                    { output = "right:Out" input = "camera_left:In 2" }
                    { output = "left:Out"  input = "camera_right:In 1" }
                    { output = "right:Out" input = "camera_right:In 2" }
                ]
                inputs = [ "left:In" "right:In" ]
                outputs = [
                    "connector_left:Out" "connector_right:Out"
                    "camera_left:Out" "camera_right:Out"
                ]
            }
            capture.props = {
                node.name = "omarchy.j120-speaker-routing"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.target = {
                    node.name = "alsa_output.platform-sound-speaker-transport.HiFi__Speaker__sink"
                }
            }
            playback.props = {
                node.name = "omarchy.j120-speaker-routing-output"
                node.passive = true
                node.dont-fallback = true
                node.linger = true
                stream.dont-remix = true
                audio.position = [ FL FR RL RR ]
            }
        }
    }
]
