name: Build Omarchy A
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      hardware_tag:
        description: Published orchard release supplying the compiled components
        required: true
        default: nightly
      hardware_run_id:
        description: Optional exact orchard run supplying first-release components
        required: false
      reuse_run_id:
        description: Exact prior run supplying unchanged boot and userspace artifacts
        required: false
      nightly:
        description: Publish this run as the rolling nightly pre-release (from main only)
        type: boolean
        default: false
  # Nightly: main with orchard's newest nightly and the Orchard package
  # repository's packages, as the rolling `nightly` pre-release, when any of
  # them changed since the last one. After orchard's own nightly (03:17 UTC),
  # so a change there is usually in the same night's build.
  schedule:
    - cron: '30 4 * * *'
permissions:
  contents: read
  actions: read
env:
  HARDWARE_TAG: ${{ inputs.hardware_tag || 'nightly' }}
  HARDWARE_ARTIFACT_DIR: ${{ inputs.hardware_run_id != '' && 'out/downloads/hardware' || '' }}
jobs:
  orchard:
    # The orchard version this run builds with, resolved once for every job:
    # nightly becomes the newest nightly-YYYYMMDD-COMMIT, a tag stays as it is.
    # And whether this run is a nightly (ci/nightly): a scheduled run is one
    # only when this commit, orchard's nightly or the Orchard package
    # repository differs from what the last nightly was built from (its
    # latest.json), so an unchanged night ends here.
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      packages: ${{ steps.packages.outputs.index }}
      nightly: ${{ steps.plan.outputs.nightly }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ci/nightly
          sparse-checkout-cone-mode: false
      - id: resolve
        run: |
          tag="$HARDWARE_TAG"
          if [[ "$tag" == nightly ]]; then
            tag=$(curl -fsSL --retry 3 https://github.com/OrchardLinux/orchard/releases/download/nightly/latest.json |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])')
          fi
          echo "orchard $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The image installs Mesa, wlroots, Labwc and the rest from the Orchard
      # package repository (system/assemble-rootfs): its index changes with
      # every package published there, so its checksum identifies them all.
      - id: packages
        run: |
          # Into a file first: a failed download must fail the step, not be hashed as nothing.
          curl -fsSL --retry 3 -o orchard.db https://github.com/OrchardLinux/packages/releases/download/repo-aarch64/orchard.db
          index=$(sha256sum orchard.db | cut -d' ' -f1)
          echo "Orchard packages $index"
          echo "index=$index" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.nightly }}
          ORCHARD_TAG: ${{ steps.resolve.outputs.tag }}
          PACKAGES: ${{ steps.packages.outputs.index }}
        run: |
          # No earlier nightly, or none that can be read: the run builds one.
          gh release download nightly --pattern latest.json --dir previous 2>/dev/null || true
          # A further input of the nightly is one more --input NAME=VALUE here and where it is recorded (the nightly job).
          ci/nightly plan --event "$EVENT" --wanted "$WANTED" --commit "$GITHUB_SHA" \
            --input "orchard=$ORCHARD_TAG" --input "packages=$PACKAGES" \
            --previous previous/latest.json | tee -a "$GITHUB_OUTPUT"
  test:
    # Not on a night without a nightly: nothing changed since these last ran.
    # They do not depend on the orchard a build would use: a failure to resolve it leaves them running.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.orchard.outputs.nightly == 'true') }}
    needs: orchard
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]'
      - name: Check release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: ci/release-notes "$TAG" >/dev/null
      # Tests follow orchard main; builds use the pinned orchard release (ci/dependencies).
      - name: Install orchard main
        run: bash ci/dependencies --tools-only
        env:
          ORCHARD_REF: main
      - run: .venv/bin/python -m unittest discover -s tests -v
  # The build jobs start beside the tests, not after them: a failed test costs
  # some building, and `assets` (so every draft and preview) still waits for both.
  artwork-check:
    # The artwork is drawn on a Mac, and only when boot/ changed: otherwise the
    # kept result of its last drawing is used, on a Linux runner.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.orchard.outputs.nightly == 'true'
    needs: orchard
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.kept.outputs.cache-hit == 'true' && 'ubuntu-24.04' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: kept
        with:
          path: out/boot-inputs.tar.gz
          key: boot-artwork-v1-${{ hashFiles('boot/**') }}
          lookup-only: true
  # Pongo is not built here: releases ship hardware's one Pongo (quiet/pongo.bin).
  artwork:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.orchard.outputs.nightly == 'true'
    needs: [orchard, artwork-check]
    runs-on: ${{ needs.artwork-check.outputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Reuse unchanged successful outputs
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: omarchy-boot-inputs
          path: out
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.reuse_run_id == ''
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        if: inputs.reuse_run_id == ''
        id: kept
        with:
          path: out/boot-inputs.tar.gz
          key: boot-artwork-v1-${{ hashFiles('boot/**') }}
      - uses: actions/setup-python@v5
        if: inputs.reuse_run_id == '' && steps.kept.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'
      - run: brew install imagemagick librsvg
        if: inputs.reuse_run_id == '' && steps.kept.outputs.cache-hit != 'true'
      - name: Generate the boot artwork, data for orchard's m1n1
        if: inputs.reuse_run_id == '' && steps.kept.outputs.cache-hit != 'true'
        run: |
          python boot/generate-logo.py --size 480 --output out/boot/omarchy-logo.h
          python boot/build-artwork --logo-header out/boot/omarchy-logo.h --output out/boot/artwork
          tar -C out -czf out/boot-inputs.tar.gz boot
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-boot-inputs
          path: out/boot-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  userspace:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.orchard.outputs.nightly == 'true'
    needs: orchard
    runs-on: ubuntu-24.04-arm
    container: docker.io/arch4edu/archlinuxarm@sha256:1db43d1af9917db5fd34af3dab64e2b229a21240e81bb765e3d2d3c34739d587
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: archlinuxarm-1db43d1-desktop-and-system
      HARDWARE_TAG: ${{ needs.orchard.outputs.tag }}
    steps:
      - name: Reuse unchanged successful outputs
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: omarchy-userspace
          path: out
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.reuse_run_id == ''
        with:
          persist-credentials: false
      - name: Install the same signed-package toolchains as local builds
        if: inputs.reuse_run_id == ''
        run: |
          bash desktop/install-toolchain
          bash system/install-toolchain
          bash ci/dependencies --tools-only
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      # No package is built here: the root installs Mesa, wlroots, Labwc and the
      # rest from the Orchard package repository. What is compiled is the
      # keyboard and the cursor helper, a few seconds of C.
      - name: Build the desktop payload and its helpers
        if: inputs.reuse_run_id == ''
        env:
          ORCHARD_CHECKOUT: ${{ github.workspace }}/.orchard
        run: |
          python desktop/build --output out/desktop
          python desktop/build-cursor-helper --output out/cursor
          python desktop/build-bluetooth-tools --output out/bluetooth
      - name: Build the signed Arch root filesystem
        if: inputs.reuse_run_id == ''
        env:
          ORCHARD_CHECKOUT: ${{ github.workspace }}/.orchard
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ID: ${{ github.run_id }}
          NIGHTLY: ${{ needs.orchard.outputs.name }}
        run: |
          VERSION="preview-$RUN_ID"
          if [[ "$REF_TYPE" == tag ]]; then VERSION="${REF_NAME#v}"; elif [[ -n "$NIGHTLY" ]]; then VERSION="$NIGHTLY"; fi
          bash system/build-rootfs --desktop out/desktop --release "$VERSION" --output out/base
          # Not compressed again: the root archive in it already is.
          tar -C out -cf out/omarchy-userspace.tar base cursor bluetooth
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-userspace
          path: out/omarchy-userspace.tar*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  assets:
    needs: [test, orchard, artwork, userspace]
    env:
      # orchard's producers run as commands from this snapshot (ci/dependencies unpacks the release's).
      ORCHARD_CHECKOUT: ${{ github.workspace }}/.orchard
      HARDWARE_TAG: ${{ needs.orchard.outputs.tag }}
      # The root image keeps its owners: as root, directly on this runner.
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: ubuntu-24.04-arm-root-image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: omarchy-*
          path: out/downloads
          merge-multiple: true
      # The runner image has zstd; an apt mirror is asked only if that ever changes.
      - run: command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
      - name: Await the exact hardware run without rebuilding components
        if: inputs.hardware_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HARDWARE_RUN_ID: ${{ inputs.hardware_run_id }}
        run: |
          [[ "$HARDWARE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run watch "$HARDWARE_RUN_ID" --repo OrchardLinux/orchard --interval 20 --exit-status
      - name: Reuse verified first-release components
        if: inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-release-assets
          path: out/downloads/hardware
          repository: OrchardLinux/orchard
          run-id: ${{ inputs.hardware_run_id }}
          github-token: ${{ github.token }}
      - run: bash ci/dependencies
      - name: Assemble, audit and stage hosted assets
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ID: ${{ github.run_id }}
          NIGHTLY: ${{ needs.orchard.outputs.name }}
        run: |
          . .venv/bin/activate
          # orchard's snapshot in .orchard is its published source archive and no
          # repository: git must not take this checkout around it for orchard's.
          export GIT_CEILING_DIRECTORIES="$GITHUB_WORKSPACE"
          # .tar, or .tar.gz from a run before the archive stopped being compressed twice.
          tar -xf out/downloads/omarchy-userspace.tar* -C out
          tar -xzf out/downloads/boot-inputs.tar.gz -C out
          VERSION="preview-$RUN_ID"
          TAG="v$VERSION"
          if [[ "$REF_TYPE" == tag ]]; then TAG="$REF_NAME"; VERSION="${TAG#v}"; fi
          # A nightly is its own pre-release: its files are published under its name.
          if [[ "$REF_TYPE" != tag && -n "$NIGHTLY" ]]; then TAG="$NIGHTLY"; VERSION="$NIGHTLY"; fi
          # Every platform's kernel from orchard's bundles; the shared tools are in each.
          kernels=()
          for bundle in out/platforms/*/components; do
            kernels+=(--kernel-dir "$(basename "$(dirname "$bundle")")=$bundle/kernel")
          done
          tools=out/platforms/apple-16k/components
          # What orchard supplies, as the same inputs file a local build gets; with every
          # component given from the release bundles, nothing is fetched or built.
          PYTHONPATH="$ORCHARD_CHECKOUT/src" python -m orchard.inputs --output out/inputs.json "${kernels[@]}" \
            --m1n1 "$tools/quiet/m1n1.bin" --pongo "$tools/quiet/pongo.bin" --tools "$tools/boot"
          tool() { python -c 'import json, sys; print(json.load(open("out/inputs.json"))["shared"]["tools"][sys.argv[1]])' "$1"; }
          # A published orchard build's files are linked from the release; a run's own are hosted with it.
          source=(--orchard-release "$HARDWARE_TAG")
          if [[ -n "${HARDWARE_ARTIFACT_DIR:-}" && -d "${HARDWARE_ARTIFACT_DIR:-}" ]]; then
            source=(--inputs out/inputs.json)
          fi
          python -m release.build --release "$VERSION" "${source[@]}" \
            --base out/base/rootfs.tar.gz --base-receipt out/base/rootfs.tar.gz.json \
            --splash out/boot/artwork/splash --logo out/boot/artwork/logo.bin \
            --busybox "$(tool busybox)" --dropbear "$(tool dropbear)" --dropbearkey "$(tool dropbearkey)" \
            --cursor-tools out/cursor --bluetooth-tools out/bluetooth \
            --output out/release
          python -m release.audit out/release/release.toml
          python -m orchard.manifests --verify-local out/release/index.toml
          # The installer: install.sh and orchard-install.pyz with orchard's launch loaders.
          python -m orchard.installer release out/release \
            --pongo "$tools/quiet/pongo.bin" --m1n1 "$tools/quiet/m1n1.bin"
          python -m release.publish --tag "$TAG" --release-dir out/release --output out/publication
          cp out/release/rootfs.json out/release/build-receipt.json out/publication/
          git archive --format=tar.gz -o out/publication/omarchy-linux-source.tar.gz HEAD
          (cd out/publication && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
      - name: Attest public build
        if: toJSON(github.event.repository.private) == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/publication/*
      - name: Include public attestation bundle
        if: toJSON(github.event.repository.private) == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/publication/omarchy-a-build.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-release-assets
          path: out/publication/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  draft:
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-release-assets
          path: assets
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            CHANGELOG.md
            ci/release-notes
          sparse-checkout-cone-mode: false
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          { (cd source && ci/release-notes "$TAG")
            printf '\n---\n\n%s\n' 'Experimental image: automatic tablet login and unrestricted passwordless sudo; no local access protection. Automated checks do not qualify hardware. Publish compatible shared-launcher assets before announcing launch support.'
          } > notes.md
          gh release create "$TAG" assets/* --draft --verify-tag --title "$TAG" \
            --notes-file notes.md
  nightly:
    # Every nightly is its own pre-release, nightly-YYYYMMDD-<commit>, with
    # everything a release has; the release `nightly` points at the newest
    # (latest.json, with what it was built from) and carries its install.sh,
    # so one address always installs the newest. A nightly takes orchard's
    # kernels and loaders from orchard's nightly, which orchard keeps 14 days:
    # nightlies older than 7 days go, the newest always stays. GitHub's
    # "latest" release (the README's install command) never is a pre-release.
    if: needs.orchard.outputs.nightly == 'true' && github.ref == 'refs/heads/main'
    needs: [orchard, assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    concurrency:
      group: omarchy-a-nightly
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-release-assets
          path: assets
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
          sparse-checkout: ci/nightly
          sparse-checkout-cone-mode: false
      - name: Publish the nightly and point nightly at it
        env:
          NAME: ${{ needs.orchard.outputs.name }}
          ORCHARD_TAG: ${{ needs.orchard.outputs.tag }}
          PACKAGES: ${{ needs.orchard.outputs.packages }}
          RUN_ID: ${{ github.run_id }}
        run: |
          (cd assets && sha256sum --check --strict SHA256SUMS)
          # A public build is attested (the assets job); its bundle is among the assets.
          if [[ -f assets/omarchy-a-build.sigstore.jsonl ]]; then gh attestation verify assets/SHA256SUMS --repo "$GH_REPO"; fi
          source/ci/nightly record --name "$NAME" --commit "$GITHUB_SHA" --run-id "$RUN_ID" \
            --input "orchard=$ORCHARD_TAG" --input "packages=$PACKAGES" > assets/nightly.json
          base="https://github.com/$GH_REPO/releases/download"
          printf '%s\n' "omarchy-a main $GITHUB_SHA with orchard $ORCHARD_TAG (run $RUN_ID). Untested on hardware, not a release; kept 7 days." \
            '' "Install: \`curl -fsSL $base/$NAME/install.sh | sh\`" > notes.md
          # A rerun of the same commit on the same day replaces that nightly.
          gh release delete "$NAME" --cleanup-tag --yes 2>/dev/null || true
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$NAME" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$NAME" assets/* --prerelease --verify-tag --latest=false --title "$NAME" --notes-file notes.md
          # The pointer: tag nightly at the same commit; its install.sh is the
          # nightly's own, which fetches and checks that nightly's installer.
          mkdir pointer
          cp assets/nightly.json pointer/latest.json
          cp assets/install.sh pointer/
          printf '%s\n' "Points at the newest nightly, $NAME (latest.json): omarchy-a main with orchard's newest nightly, untested on hardware." \
            '' "Install it: \`curl -fsSL $base/nightly/install.sh | sh\`" > pointer-notes.md
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          gh release create nightly pointer/* --prerelease --verify-tag --latest=false --title "nightly → $NAME" \
            --notes-file pointer-notes.md
          echo "$base/nightly/install.sh" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove nightlies older than 7 days
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | source/ci/nightly expired --keep-days 7 |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
