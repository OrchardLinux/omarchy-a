# Use a dedicated container and Linux filesystem for this export.
NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_UDP = false;
    Enable_NLM = false;
}

NFS_KRB5 { Active_krb5 = false; }

# The RAM client uses AUTH_SYS numeric IDs and has no name-mapping daemon.
NFSV4 {
    Allow_Numeric_Owners = true;
    Only_Numeric_Owners = true;
}

EXPORT {
    Export_Id = 61;
    Path = /srv/root;
    Pseudo = /n61-root;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL { Name = VFS; }
}

LOG { Default_Log_Level = EVENT; }
