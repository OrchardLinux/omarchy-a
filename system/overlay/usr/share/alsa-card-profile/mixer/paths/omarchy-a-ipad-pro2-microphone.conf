[General]
description-key = analog-input-microphone-internal

[Element Mic]
required = volume
volume = merge
# The PDM gain goes to +42 dB, which clips the iPad Pro 2 microphones at
# desktop unity (measured on a J120).
# Step 3 (+18 dB) leaves headroom while keeping the slider functional.
volume-limit = 3
override-map.1 = all
