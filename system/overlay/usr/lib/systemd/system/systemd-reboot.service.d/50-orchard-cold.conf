[Service]
# reboot.target uses RB_AUTOBOOT even with a loaded image: always select cold.
# Image-backed warm hops use the separate kexec dispatch transaction.
# The kernel notifier is the fallback if either best-effort pre-step fails.
ExecStartPre=-/usr/bin/timeout --kill-after=1 10 /usr/lib/orchard-kexec/quiesce-gpu
ExecStartPre=-/usr/bin/timeout --kill-after=1 5 /usr/bin/orchard-kexec prepare-reboot
