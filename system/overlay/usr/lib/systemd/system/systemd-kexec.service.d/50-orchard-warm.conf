[Unit]
# Last resort if dispatch cannot run or its emergency escape returns.
FailureAction=none
# Dispatch requests kexec or cold reboot itself; never override a cold escape.
SuccessAction=none

[Service]
ExecStart=
# Every GPU client is stopped by now: hand the GPU over before the jump.
ExecStartPre=-/usr/bin/timeout --kill-after=1 10 /usr/lib/orchard-kexec/quiesce-gpu
ExecStart=/usr/bin/orchard-kexec dispatch
TimeoutStartSec=infinity
