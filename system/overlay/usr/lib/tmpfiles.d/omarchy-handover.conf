# Session transitions (desktop/labwc/0003-session-transitions.patch).
# The greeter's and the desktop's Labwc hand their last picture to each other
# here: both users are in video, nobody else can read it, and it is on tmpfs.
d /run/omarchy-handover 2770 root video -
# The picture on the panel must survive the moment between the two compositors:
# without this the kernel restores its own, blank console picture there. The
# panel then shows no text console when no compositor runs; serial and SSH do.
w /sys/module/drm_kms_helper/parameters/fbdev_emulation - - - - N
