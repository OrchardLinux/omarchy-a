# The speakers' output keeps ALSA's PCM name as its short name
# ("s8000-mca-HiFi HiFi-0"), and the shell's audio menu shows the short name.
# Name it for what it is. Match the UCM Speaker node only; headphones are a
# second output on the same simple-audio-card and must not be named Speakers.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        node.nick = "Speakers"
      }
    }
  }
]
