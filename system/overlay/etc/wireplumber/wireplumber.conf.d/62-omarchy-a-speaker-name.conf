# The speakers' output keeps ALSA's PCM name as its short name
# ("s8000-mca-HiFi HiFi-0"), and the shell's audio menu shows the short name.
# Name it for what it is. The node is the built-in sound card's (the
# simple-audio-card at /sound), with the UCM Speaker device of
# /usr/share/alsa/ucm2/Orchard on every iPad that has one.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = {
      update-props = {
        node.nick = "Speakers"
      }
    }
  }
]
