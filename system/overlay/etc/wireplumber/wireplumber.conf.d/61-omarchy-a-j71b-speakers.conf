# The J71b's four amplifiers sit on a four-channel link with no stereo downmix
# in the kernel. Copy the stereo signal to the other two channels, so nothing
# stays silent; the link only takes S16 at 48 kHz.
monitor.alsa.rules = [
  {
    matches = [ { alsa.card_name = "J71b Speakers" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
      }
    }
  }
]
