# The iPad 6's amplifiers sit on a four-channel link with no stereo downmix
# in the kernel. Copy the stereo signal to the other two channels, so nothing
# stays silent; the link only takes S16 at 48 kHz. J72b is assumed to match
# J71b.
#
# Match the Speaker node only, as 61-omarchy-a-ipad7-speakers.conf does: the
# headphone jack is a second PCM on the same card that only accepts S32_LE
# (63-omarchy-a-headphones.conf).
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "J71b Speakers", node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
      { alsa.card_name = "J72b Speakers", node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
      }
    }
  }
]
