# iPad Pro 2 (J120, J121, J207, J208; one device tree, t8011-pro2.dtsi): the
# PDM microphones clip at the controller's top gain, so their volume stops at
# +18 dB (omarchy-a-ipad-pro2-microphone.conf).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound-microphones"
        api.alsa.card.name = "~J(120|121|207|208) Microphones"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "omarchy-a-ipad-pro2-microphones.conf"
      }
    }
  }
]
