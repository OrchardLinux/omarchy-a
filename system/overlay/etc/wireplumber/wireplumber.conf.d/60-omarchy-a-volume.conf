# The speakers' amplifier has no volume control of its own, so PipeWire's is
# the only one: start a new output at 10% (on the cubic scale the shell and
# wpctl show; WirePlumber stores it linear, 0.1^3), not WirePlumber's 40%.
# The last volume set is kept as usual after that.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.001
}
