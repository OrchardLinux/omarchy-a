# The iPad 7's two bottom speakers sit on a four-slot link with no stereo
# downmix in the kernel: on one J171, slots 1 and 2 drive the left speaker and
# 3 and 4 the right one. Map the channels in slot order so stereo reaches both
# speakers, and copy it to the rear channels so no slot stays silent; the link
# only takes S16 at 48 kHz. J172 is assumed to match.
#
# Match the Speaker node only. The headphone jack is a second PCM on the same
# card (hw:N,1) that only accepts S32_LE; a card-name match applied this
# format to both, and PipeWire never created the headphones sink.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "J171 Speakers", node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
      { alsa.card_name = "J172 Speakers", node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.position = [ FL, RL, FR, RR ]
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
      }
    }
  }
]
