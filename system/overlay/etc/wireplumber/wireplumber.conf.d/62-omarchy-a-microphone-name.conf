# The built-in microphones' input is named after its sound card and PCM
# (the simple-audio-card at /sound-microphones), and the shell's audio menu
# shows that. Name it for what it is, as 62-omarchy-a-speaker-name.conf does
# for the speakers, on every iPad that has the card.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.platform-sound-microphones.*" } ]
    actions = {
      update-props = {
        node.nick = "Internal Microphone"
        node.description = "Internal Microphone"
      }
    }
  }
]
