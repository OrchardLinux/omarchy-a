# The headphone jack on the shared iPad 6 and 7 card is a second PCM
# (hw:N,1): S32_LE, 2ch, 48 kHz. Name it Headphones, and raise its session
# priority above the speakers (WirePlumber ranks PCM 0 at 1000 and PCM 1 at
# 728, so the speakers stay the default even with the jack in). UCM
# PlaybackPriority only ranks routes. While the jack is out, the Headphones
# route is unavailable and this node is skipped. A user-saved default (a
# Bluetooth sink) still wins while it is connected.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.nick = "Headphones"
        audio.format = "S32LE"
        audio.rate = 48000
        audio.position = [ FL, FR ]
        priority.driver = 1100
        priority.session = 1100
      }
    }
  }
]
